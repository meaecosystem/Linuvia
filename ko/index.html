<script>
  (function () {
    var loadEl = document.getElementById('mea-loading');
    var slowEl = document.getElementById('mea-loading-slow');
    var slowTimer = setTimeout(function () { slowEl.classList.add('show'); }, 3000);

    function hideLoading() {
      clearTimeout(slowTimer);
      loadEl.classList.add('mea-loading-hidden');
      setTimeout(function () { loadEl.remove(); }, 400);
    }

    if (document.readyState === 'complete') {
      hideLoading();
    } else {
      window.addEventListener('load', hideLoading);
    }
  })();

  (function () {
    var btn = document.getElementById('mea-notify-btn');
    var label = document.getElementById('mea-notify-label');
    if (!btn || !('Notification' in window)) {
      if (btn) btn.hidden = true;
      return;
    }

    function reflectState() {
      if (Notification.permission === 'granted') {
        btn.setAttribute('data-state', 'granted');
        label.textContent = '알림 켜짐';
      } else if (Notification.permission === 'denied') {
        btn.setAttribute('data-state', 'denied');
        label.textContent = '알림이 차단됨';
      }
    }
    reflectState();

    btn.addEventListener('click', function () {
      if (Notification.permission !== 'default') return;
      Notification.requestPermission().then(reflectState);
    });
  })();
</script>
